<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="Website belum tersedia atau sedang dalam maintenance."
    />
    <title>404 — Halaman Tidak Ditemukan</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: rgba(19, 28, 51, 0.78);
        --text: #f4f7ff;
        --muted: #a6b1c8;
        --accent: #8b9cff;
        --accent2: #63e6d2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        overflow: hidden;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            ellipse at 15% 20%,
            rgba(99, 230, 210, 0.13),
            transparent 35%
          ),
          radial-gradient(
            ellipse at 85% 80%,
            rgba(139, 156, 255, 0.18),
            transparent 38%
          ),
          var(--bg);
      }
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(1px);
        pointer-events: none;
      }
      .orb.one {
        width: 240px;
        height: 240px;
        top: -110px;
        right: 12%;
        background: rgba(139, 156, 255, 0.1);
      }
      .orb.two {
        width: 180px;
        height: 180px;
        bottom: -80px;
        left: 8%;
        background: rgba(99, 230, 210, 0.09);
      }
      main {
        position: relative;
        width: min(100%, 720px);
        padding: clamp(30px, 7vw, 66px);
        text-align: center;
        border: 1px solid rgba(190, 204, 255, 0.14);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.35);
      }
      .icon {
        width: 76px;
        height: 76px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(139, 156, 255, 0.32);
        border-radius: 24px;
        color: var(--accent2);
        background: rgba(139, 156, 255, 0.09);
      }
      .icon svg {
        width: 38px;
        height: 38px;
      }
      .code {
        margin: 0;
        font-size: clamp(5rem, 18vw, 9rem);
        line-height: 0.95;
        letter-spacing: -0.09em;
        font-weight: 850;
        color: transparent;
        background: linear-gradient(
          110deg,
          #fff 15%,
          var(--accent) 55%,
          var(--accent2)
        );
        -webkit-background-clip: text;
        background-clip: text;
      }
      h1 {
        margin: 22px 0 12px;
        font-size: clamp(1.45rem, 4vw, 2rem);
        letter-spacing: -0.035em;
      }
      .message {
        max-width: 510px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.8;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 28px;
        padding: 9px 14px;
        border: 1px solid rgba(99, 230, 210, 0.22);
        border-radius: 999px;
        color: #b9fff4;
        background: rgba(99, 230, 210, 0.07);
        font-size: 0.82rem;
        font-weight: 650;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent2);
        box-shadow: 0 0 12px var(--accent2);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 32px;
      }
      a {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.92rem;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      a:hover {
        transform: translateY(-2px);
      }
      .primary {
        color: #0b1020;
        background: linear-gradient(110deg, #aab5ff, #76f0df);
      }
      .secondary {
        color: var(--text);
        border: 1px solid rgba(190, 204, 255, 0.2);
        background: rgba(255, 255, 255, 0.035);
      }
      footer {
        margin-top: 38px;
        color: #74819d;
        font-size: 0.78rem;
      }
      @media (max-width: 480px) {
        body {
          padding: 16px;
        }
        main {
          border-radius: 22px;
        }
        .actions a {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <main>
      <div class="icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" />
          <path d="M4.5 7.8 12 12l7.5-4.2M12 12v8.5" />
          <path d="m9.3 9.9 1.4 1.4 3-3" />
        </svg>
      </div>
      <p class="code">404</p>
      <h1>Halaman Tidak Ditemukan</h1>
      <p class="message">
        Mohon maaf, halaman yang Anda cari belum tersedia, mungkin telah
        dipindahkan, atau website sedang dalam proses maintenance. Silakan coba
        kembali beberapa saat lagi.
      </p>
      <div class="status">
        <span class="dot"></span> Website sedang tidak tersedia
      </div>
      <div class="actions">
        <a
          class="primary"
          href="index.html"
          onclick="
            if (location.pathname === '/') {
              location.reload();
              return false;
            }
          "
          >Kembali ke Beranda</a
        >
        <a class="secondary" href="javascript:location.reload()"
          >Coba Muat Ulang</a
        >
      </div>
      <footer>Terima kasih atas pengertian Anda.</footer>
    </main>
  </body>
</html>
